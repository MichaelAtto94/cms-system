services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD}@postgres:5432/cms
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      DATA_DIR: /app/data
      BIND_ALL: "true"
      NODE_ENV: development
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  app_data:
